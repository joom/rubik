name: Proofs

# The kernel's own verdict: the proofs compile, nothing is assumed, and the
# generated tables checked into theories/ are the ones the generators produce.
# Everything past the kernel is covered by native.yml.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  check:
    # the OS must be GNU/Linux to be able to use the docker-coq-action
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'rocq/rocq-prover:9.0'
          - 'rocq/rocq-prover:9.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-rubik.opam'
          custom_image: ${{ matrix.image }}
          before_script: |
            startGroup "Take ownership of the checkout"
              # The runner checks the sources out as itself; the image builds
              # as another user, and dune cannot create _build without this.
              sudo chown -R "$(id -u):$(id -g)" .
            endGroup
          script: |
            startGroup "Kernel and generated-table checks"
              sudo apt-get install -y python3
              opam exec -- make check
            endGroup


# See also:
# https://github.com/coq-community/docker-coq-action#readme
# https://github.com/erikmd/docker-coq-github-action-demo
